name: Xi'an Time Strata Final Preflight

on:
  push:
    branches:
      - work/xian-time-strata-20260829

permissions:
  contents: write

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[xian-time-final]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/xian-time-strata-20260829
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Harden map crossfade
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('be-a-viewer/xian/xian-time.js')
          text = path.read_text()
          vars_block = '''  let activeFrame = frameA;
          let inactiveFrame = frameB;
          let activeStep = 0;
          let activeImage = steps[0].image;
          let pendingImage = "";
          let mediaToken = 0;
          let animationFrame = 0;'''
          frame_block = '''  function setFrame(step) {
            const next = step.image;
            if (next === activeImage) {
              mediaToken += 1;
              pendingImage = "";
              applyFrameStyle(activeFrame, step);
              return;
            }
            if (next === pendingImage) {
              applyFrameStyle(inactiveFrame, step);
              return;
            }

            const token = ++mediaToken;
            pendingImage = next;
            inactiveFrame.src = next;
            inactiveFrame.alt = `${step.year} — ${step.label}`;
            applyFrameStyle(inactiveFrame, step);

            const reveal = () => {
              if (token !== mediaToken || pendingImage !== next) return;
              inactiveFrame.classList.add("is-visible");
              activeFrame.classList.remove("is-visible");
              [activeFrame, inactiveFrame] = [inactiveFrame, activeFrame];
              activeImage = next;
              pendingImage = "";
            };

            if (inactiveFrame.complete) requestAnimationFrame(reveal);
            else inactiveFrame.addEventListener("load", reveal, { once: true });
          }'''

          text, n1 = re.subn(
              r'  let activeFrame = frameA;.*?  let animationFrame = 0;',
              vars_block,
              text,
              count=1,
              flags=re.S,
          )
          text, n2 = re.subn(
              r'  function setFrame\(step\) \{.*?\n  \}\n\n  function setStep\(index\) \{',
              frame_block + '\n\n  function setStep(index) {',
              text,
              count=1,
              flags=re.S,
          )
          if n1 != 1 or n2 != 1:
              raise SystemExit(f'Patch counts wrong: variables={n1}, setFrame={n2}')
          path.write_text(text)
          PY
          grep -q 'let mediaToken = 0' be-a-viewer/xian/xian-time.js
          grep -q 'token !== mediaToken' be-a-viewer/xian/xian-time.js
      - name: Install release tools
        run: npm ci --ignore-scripts
      - name: Run release
        run: npm run release
      - name: Commit final validated output
        run: |
          rm -f .github/workflows/xian-time-final-preflight.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Xi'an time strata [xian-time-final]"
          git push origin HEAD:work/xian-time-strata-20260829
