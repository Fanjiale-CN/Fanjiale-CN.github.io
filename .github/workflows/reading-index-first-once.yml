# one-time retry: stable discovery verifier
name: Reading index-first release gate once

on:
  push:
    branches:
      - fix/reading-index-first-20260831
    paths:
      - .github/workflows/reading-index-first-once.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/reading-index-first-20260831
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Apply requested Reading layout
        run: node scripts/apply-reading-index-first-once.mjs
      - name: Refresh generated discovery assets
        run: npm run build:discovery
      - name: Commit candidate locally
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Simplify Reading landing and promote index"
      - name: Normalize discovery against committed source dates
        run: |
          npm run build:discovery
          git add feed.xml sitemap.xml index/search-catalog.json pagefind
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi
      - name: Run requested release gate
        run: npm run release
      - name: Remove one-time helpers
        run: |
          git rm scripts/apply-reading-index-first-once.mjs .github/workflows/reading-index-first-once.yml
          git commit -m "Remove one-time Reading layout helpers"
      - name: Re-run release on final tree
        run: npm run release
      - name: Push validated branch
        run: git push origin HEAD:fix/reading-index-first-20260831
