name: Temporary Yantie Bilingual Catalogue

on:
  push:
    branches:
      - feat/yantie-bilingual-chapter-titles
    paths:
      - '.github/workflows/tmp-yantie-bilingual-catalog.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/yantie-bilingual-chapter-titles
          fetch-depth: 0

      - name: Generate static bilingual catalogue
        run: python scripts/tmp_yantie_bilingual_catalog.py

      - name: Install font tools
        run: python -m pip install --disable-pip-version-check --upgrade fonttools brotli

      - name: Rebuild Reading font subsets
        run: python scripts/build-reading-font-subsets.py

      - name: Verify Reading serif coverage
        run: python scripts/check-reading-font-coverage.py

      - name: Verify Qiji covers all Yantie chapter titles
        run: |
          python - <<'PY'
          from fontTools.ttLib import TTFont
          titles = set('本議力耕通有錯幣禁耕復古非鞅晁錯刺權刺復論儒憂邊園池輕重未通地廣貧富毀學褒賢相刺殊路訟賢遵道論誹孝養刺議利議國疾散不足救匱箴石除狹疾貪後刑授時水旱崇禮備胡執務能言取下擊之結和誅秦伐功西域世務和親繇役險固論勇論功論鄒論菑刑德申韓周秦詔聖大論雜論')
          font = TTFont('assets/fonts/qiji-reading-title.woff2')
          cmap = set()
          for table in font['cmap'].tables:
              cmap.update(table.cmap.keys())
          missing = sorted(ch for ch in titles if ord(ch) not in cmap)
          if missing:
              raise SystemExit('Qiji missing Yantie title glyphs: ' + ' '.join(missing))
          print(f'Qiji Yantie title coverage: {len(titles)}/{len(titles)}')
          PY

      - name: Commit catalogue and font artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reading/salt-and-iron/index.html scripts/build-reading-font-subsets.py assets/fonts/genryu-reading-tw.woff2 assets/fonts/qiji-reading-title.woff2 assets/fonts/hanamin-reading-rare.woff2
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "feat(reading): publish bilingual Yantie chapter catalogue"
          git push origin HEAD:feat/yantie-bilingual-chapter-titles
