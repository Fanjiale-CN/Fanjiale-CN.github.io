name: Reading notes depth release once

on:
  push:
    branches:
      - fix/reading-notes-depth-20260831
    paths:
      - .github/workflows/reading-notes-depth-once.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/reading-notes-depth-20260831
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: Apply Reading depth migration
        run: node scripts/apply-reading-notes-depth-once.mjs
      - name: Refresh discovery assets
        run: npm run build:discovery
      - name: Commit redesigned notes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reading pagefind feed.xml sitemap.xml index/search-catalog.json
          git commit -m "Deepen Reading 001 notes and simplify contents labels"
      - name: Run requested release gate
        run: npm run release
      - name: Remove one-time helpers
        run: |
          rm scripts/apply-reading-notes-depth-once.mjs
          rm .github/workflows/reading-notes-depth-once.yml
          git add -A
          git commit -m "Remove one-time Reading depth helpers"
      - name: Push validated branch
        run: git push origin HEAD:fix/reading-notes-depth-20260831
