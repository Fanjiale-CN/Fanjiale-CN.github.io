          @media(max-width:960px){.data-desk{width:min(100% - 36px,1480px)}.data-desk-hero{grid-template-columns:1fr;min-height:0;gap:30px}.data-desk-title{padding-left:0}.data-desk-title h1{font-size:clamp(4rem,15vw,7rem)}.data-desk-intro{padding-left:0;border-left:0}.data-desk-latest>header,.data-desk-explore>header,.data-desk-analysis>header{grid-template-columns:1fr;gap:16px}.data-desk-explore>header>div{grid-template-columns:1fr;gap:14px}.data-latest-grid{grid-template-columns:repeat(2,1fr)}.data-search-row{grid-template-columns:1fr;gap:12px}.data-filter-row{margin-left:0}.data-series-head,.data-series-list article{grid-template-columns:minmax(0,1fr) 120px 100px}.data-series-head span:last-child,.data-series-list article>a{display:none}.data-desk-method{grid-template-columns:1fr;gap:18px}.data-desk-method>div{grid-template-columns:1fr;gap:20px}}
          @media(max-width:620px){.data-desk{width:calc(100% - 28px);padding-top:20px}.data-desk-title h1{font-size:18vw}.data-latest-grid{grid-template-columns:1fr}.data-latest-grid .data-latest-primary{grid-column:auto}.data-latest-grid article{min-height:170px}.data-series-head{display:none}.data-series-list article{grid-template-columns:1fr auto;gap:8px 16px;padding:20px 0}.data-series-list article>span{grid-column:1}.data-series-list article>a{display:block;grid-column:2;grid-row:2}.data-analysis-card{grid-template-columns:1fr}.data-analysis-card figure{height:300px}.data-analysis-card h3{font-size:11vw}.data-desk-method{padding-top:54px}}
          CSS

          cat > data/data-desk-v1.js <<'JS'
          (() => {
            const input = document.querySelector('[data-data-search]');
            const cards = [...document.querySelectorAll('[data-series]')];
            const buttons = [...document.querySelectorAll('[data-data-filter]')];
            const empty = document.querySelector('[data-data-empty]');
            if (!input || !cards.length) return;
            let category = 'all';
            const apply = () => {
              const q = input.value.trim().toLowerCase();
              let shown = 0;
              cards.forEach((card) => {
                const categoryMatch = category === 'all' || card.dataset.category === category;
                const searchMatch = !q || (card.dataset.searchText || card.textContent).toLowerCase().includes(q);
                card.hidden = !(categoryMatch && searchMatch);
                if (!card.hidden) shown += 1;
              });
              if (empty) empty.hidden = shown !== 0;
            };
            input.addEventListener('input', apply);
            buttons.forEach((button) => button.addEventListener('click', () => {
              category = button.dataset.dataFilter || 'all';
              buttons.forEach((item) => { const active = item === button; item.classList.toggle('is-active', active); item.setAttribute('aria-pressed', String(active)); });
              apply();
            }));
          })();
          JS

          rm -f .github/workflows/build-data-desk-v1-once.yml

      - name: Verify Data desk split
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const data = fs.readFileSync('data/index.html','utf8');
          const essay = fs.readFileSync('essays/china-in-more-than-one-number/index.html','utf8');
          const content = fs.readFileSync('content.js','utf8');
          const css = fs.readFileSync('data/data-desk-v1.css','utf8');
          const js = fs.readFileSync('data/data-desk-v1.js','utf8');
          const checks = [
            ['data desk hero', data.includes('Numbers first.')],
            ['data search', data.includes('data-data-search') && js.includes('dataFilter')],
            ['data no longform', !data.includes('data-longform') && !data.includes('THE CLAIM')],
            ['related analysis', data.includes('/essays/china-in-more-than-one-number/')],
            ['essay route', essay.includes('DATA INSIGHT / ESSAY') && essay.includes('Open the Data desk')],
            ['essay nav', essay.includes('href="/essays/" aria-current="page"')],
            ['essay catalog', content.includes('/essays/china-in-more-than-one-number/') && content.includes('issue: 13')],
            ['responsive css', css.includes('@media(max-width:620px)')]
          ];
          for (const [name, ok] of checks) { if (!ok) throw new Error(`failed: ${name}`); console.log(`ok: ${name}`); }
          NODE
      - name: Install CI tools
        run: npm ci
      - name: Generate discovery and run release core
        run: |
          npm run build:discovery
          npm run release:core
