name: Finalize Reading Safari repair once

on:
  push:
    branches:
      - feat/fix-reading-safari-nav-20260830
    paths:
      - .github/workflows/finalize-reading-safari-fix-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/fix-reading-safari-nav-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install CI tools
        run: npm ci --ignore-scripts
      - name: Refresh discovery assets
        run: npm run build:discovery
      - name: Validate repository
        run: node scripts/validate-site.mjs
      - name: Start static server
        run: |
          node scripts/serve-static.mjs > /tmp/galok-static-server.log 2>&1 &
          for attempt in 1 2 3 4 5; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/galok-static-server.log
          exit 1
      - name: Verify responsive geometry
        env:
          BASE_URL: http://127.0.0.1:4173
          CHROME_PATH: /usr/bin/google-chrome
          VISUAL_EVIDENCE_DIR: artifacts/ci/visual-acceptance
        run: npm run ci:visual
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml index/search-catalog.json pagefind
          if git diff --cached --quiet; then
            echo "Discovery already clean."
          else
            git commit -m "Refresh Reading discovery assets"
            git push origin HEAD:feat/fix-reading-safari-nav-20260830
          fi
