name: Import uploaded home thumbnails

on:
  push:
    paths:
      - '.github/workflows/import-home-uploaded-thumbnails.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Copy the two user-provided images verbatim
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/home
          curl -fL 'https://at.adobe.com/gnKbivu8MD2teqyx' -o assets/home/hero-airport-user.jpeg
          curl -fL 'https://at.adobe.com/vYUvFe2IQimsW9tr' -o assets/home/hero-doraemon-user.jpeg
          test -s assets/home/hero-airport-user.jpeg
          test -s assets/home/hero-doraemon-user.jpeg
          file assets/home/hero-airport-user.jpeg
          file assets/home/hero-doraemon-user.jpeg
      - name: Commit exact uploaded files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/home/hero-airport-user.jpeg assets/home/hero-doraemon-user.jpeg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'assets(home): import user-provided hero thumbnails'
          git push origin HEAD:main
