name: Xi'an English-only Preflight

on:
  push:
    branches:
      - work/xian-english-fix-20260830

permissions:
  contents: write

concurrency:
  group: xian-english-fix-preflight
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/xian-english-fix-20260830
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Convert cinematic archive to English only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('be-a-viewer/xian/xian-time.js')
          text = path.read_text(encoding='utf-8')

          replacements = {
            'const VERSION = "20260830-cinema1";': 'const VERSION = "20260830-cinema2";',
            'mark: "今"': 'mark: "NOW"',
            'mark: "半"': 'mark: "BANPO"',
            'mark: "周"': 'mark: "ZHOU"',
            'mark: "秦"': 'mark: "QIN"',
            'mark: "俑"': 'mark: "QIN"',
            'mark: "汉"': 'mark: "HAN"',
            'mark: "陵"': 'mark: "HAN"',
            'mark: "隋"': 'mark: "SUI"',
            'mark: "唐"': 'mark: "TANG"',
            'mark: "塔"': 'mark: "PAGODA"',
            'mark: "城"': 'mark: "CITY"',
            'mark: "影"': 'mark: "ARCHIVE"',
            'mark: "院"': 'mark: "1911"',
            'mark: "事"': 'mark: "1936"',
            'mark: "八"': 'mark: "1985"',
            'mark: "街"': 'mark: "1996"',
            'mark: "路"': 'mark: "2006"',
            '永宁门仍然站在城市中心。接下来，画面会沿着真实遗址、考古现场与历史摄影向后退。': 'Yongning Gate still stands at the centre of Xi’an. From here, the sequence moves backward through surviving sites, archaeological excavations, and historical photography.',
            '半坡遗址留下房址、窑穴与聚落痕迹。城市还没有出现，人已经在这片土地上长期生活。': 'Banpo preserves house foundations, kilns, and traces of settlement. There was no city yet, but people had already been living on this ground for generations.',
            '丰京车马坑把西周都城从文字重新拉回地面。木车已经腐朽，轮廓、马骨与土层仍在。': 'The Fengjing carriage pit brings the Western Zhou capital back from text into physical ground. The wooden vehicles are gone; wheel traces, horse bones, and soil layers remain.',
            '秦始皇陵的封土仍然存在。镜头先停在地表，再进入已经被发现的地下军阵。': 'The burial mound of Qin Shi Huang still rises above the plain. The camera pauses at the surface before descending into the parts of the underground complex that have been uncovered.',
            '一号坑把规模一次性摊开。滚动继续时，镜头从军阵远景逐渐推进到陶俑本身。': 'Pit 1 reveals the army at full scale. As the page moves, the view advances from the massed formation toward the terracotta figures themselves.',
            '近景让宏大的军阵重新变成人的尺度：发髻、甲片、姿态和表情都存在差异。': 'Close views bring the army back to human scale: hairstyles, armour plates, postures, and expressions all vary from figure to figure.',
            '未央宫前殿只剩巨大的台基与地形。建筑消失以后，尺度反而成为最直接的证据。': 'Only the vast platform and terrain of Weiyang Palace’s Front Hall remain. Once the architecture disappears, scale becomes the clearest evidence.',
            '汉阳陵的陪葬坑里出现侍从、动物与日常生活的缩影。地下世界从军队变成了社会。': 'The burial pits at Yangling contain attendants, animals, and miniature fragments of everyday life. The underground world shifts from an army to a society.',
            '明德门遗址属于隋大兴—唐长安城体系。这里承担从汉长安向隋唐长安的转场。': 'The Mingde Gate site belongs to the Sui Daxing–Tang Chang’an urban system. It bridges the move from Han Chang’an to the capital of the Sui and Tang.',
            '含元殿遗址让唐长安重新获得尺度。台基、坡道和远景足以让镜头停留，不需要复原图。': 'The Hanyuan Hall site restores the scale of Tang Chang’an. Platforms, ramps, and the distant horizon are enough; no reconstruction is needed.',
            '大雁塔的历史第一次从遗址摄影切换到真正的历史摄影。画面介质本身开始成为时间的一部分。': 'At the Giant Wild Goose Pagoda, the sequence shifts from present-day photographs of ancient remains to an actual historical photograph. The medium itself now becomes part of the timeline.',
            '明代城墙把后来的西安旧城重新收紧。它比隋唐长安小得多，却成为今天最清晰的城市历史边界。': 'The Ming wall pulled the later city of Xi’an into a tighter enclosure. It was far smaller than Sui–Tang Chang’an, yet it remains the clearest historical boundary in the city today.',
            '从这一段开始，网页不再依赖今天拍摄的遗址。1907年的城门直接把观看者送进当时的西安。': 'From here, the sequence no longer depends on photographs taken in the present. A 1907 image of the gate takes us directly into the Xi’an seen by that camera.',
            '约1908年的城墙照片保留了道路、地貌与城体的关系。画面保持原比例，不把档案裁成普通网页背景。': 'This photograph from around 1908 preserves the relationship between road, terrain, and wall. Its original proportions are kept intact rather than cropped into a generic web background.',
            '旧庭院把时间线从宫殿、城墙和政权拉回普通生活空间。历史在门槛、树影和砖地上继续。': 'The courtyard shifts the timeline away from palaces, walls, and regimes toward ordinary domestic space. History continues across thresholds, tree shadows, and brick paving.',
            '这一章使用西安事变旧址的真实摄影，让地点承担历史，不用来源和版权都不稳定的网络旧照拼贴。': 'This chapter uses the surviving site of the Xi’an Incident and lets the place carry the history, avoiding unstable or poorly licensed historical image collages.',
            '1959年的城市公共生活留下真实历史摄影。分辨率有限，所以这一镜只短暂停留，不做过度放大。': 'A 1959 photograph records public life in the city. Its source image is modest in resolution, so the shot stays brief and avoids aggressive enlargement.',
            '1985年的航拍把城墙、道路和新城区放进同一张彩色照片。摄影介质开始接近今天。': 'The 1985 aerial view places the wall, roads, and expanding districts in one colour frame. The photographic medium is beginning to resemble the present.',
            '市场、人群与街道把历史从纪念性建筑拉回日常。此时的西安已经越来越像记忆里的现代城市。': 'Markets, crowds, and streets return the archive to ordinary life. By the mid-1990s, Xi’an already looks increasingly like the modern city held in living memory.',
            '早期数码摄影把招牌、车辆和街道完整留下。画面的清晰度提高，历史与今天之间只剩一个很短的距离。': 'Early digital photography records signs, vehicles, and street life with new clarity. The visual distance between archive and present has become very short.',
            '三千多年的都城史没有留下一座完整城市。它留下的是一层又一层仍然可以被看见、被经过的现场。': 'More than three millennia of capital history did not leave one complete city behind. It left layers of places that can still be seen, crossed, and inhabited.',
            '从半坡、西周、秦汉与隋唐遗址，到20世纪真正的历史摄影，再回到今天。这里不复原一座不存在的城市，只观看真实留下来的东西。': 'From Banpo, the Western Zhou, Qin and Han, through the Sui–Tang capital, into twentieth-century historical photography and back to the present. Nothing here invents a vanished city; the sequence looks only at what has genuinely survived.',
            '向下滚动 · 照片就是时间轴': 'SCROLL DOWN · PHOTOGRAPHS ARE THE TIMELINE',
            '它把很多时代留在了同一片土地上。': 'IT LEFT MANY AGES ON THE SAME GROUND.'
          }

          missing = []
          for old, new in replacements.items():
              if old not in text:
                  missing.append(old)
              text = text.replace(old, new)
          if missing:
              raise SystemExit('Missing expected strings: ' + ' | '.join(missing))
          path.write_text(text, encoding='utf-8')

          # Bump the full cache chain and validator expectation.
          for filename in [
              'be-a-viewer/xian/index.html',
              'be-a-viewer/xian/xian-history.js',
              'be-a-viewer/xian/xian.js',
              'scripts/validate-xian-history.mjs'
          ]:
              p = Path(filename)
              s = p.read_text(encoding='utf-8')
              if '20260830-cinema1' not in s:
                  raise SystemExit(f'Expected cache key not found in {filename}')
              p.write_text(s.replace('20260830-cinema1', '20260830-cinema2'), encoding='utf-8')

          # Visible copy, marks and documentary captions must now be English-only.
          t = path.read_text(encoding='utf-8')
          import re
          visible_segments = []
          visible_segments += re.findall(r'mark:\s*"([^"]*)"', t)
          visible_segments += re.findall(r'copy:\s*"([^"]*)"', t)
          visible_segments += re.findall(r'<h3>(.*?)</h3>', t)
          visible_segments += re.findall(r'<p>(.*?)</p>', t)
          visible_segments += re.findall(r'<span>(.*?)</span>', t)
          bad = [s for s in visible_segments if re.search(r'[\u3400-\u9fff]', s)]
          if bad:
              raise SystemExit('Visible CJK text remains: ' + ' | '.join(bad[:20]))
          PY

      - name: Check module syntax
        run: node --check be-a-viewer/xian/xian-time.js

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run complete release validation
        run: npm run release

      - name: Commit validated English-only fix
        shell: bash
        run: |
          git rm --ignore-unmatch .github/workflows/xian-english-fix-preflight.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make Xi'an cinematic archive English-only"
          git push origin HEAD:work/xian-english-fix-20260830
