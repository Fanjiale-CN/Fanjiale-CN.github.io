name: Fix Discovery Artifacts Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-discovery-once.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Add one-shot discovery artifact fixer'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Regenerate discovery artifacts
        run: npm run build:discovery
      - name: Commit generated artifacts and remove fixer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml index/search-catalog.json pagefind
          git rm .github/workflows/fix-discovery-once.yml
          git commit -m "Regenerate discovery artifacts"
          git push origin HEAD:main
