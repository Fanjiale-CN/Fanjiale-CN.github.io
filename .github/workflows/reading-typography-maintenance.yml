name: Reading Typography Maintenance

on:
  workflow_dispatch:
  # TEMPORARY development trigger for Entry 19 font-corpus refresh only.
  # This push trigger is removed immediately after the runner commits the canonical fonts.
  push:
    branches:
      - work/dongjing-volume3-19-20-sourcehan
    paths:
      - ".github/workflows/reading-typography-maintenance.yml"
      - "reading/dongjing-meng-hua-lu/19/**"

permissions:
  contents: write

concurrency:
  group: reading-typography-maintenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rebuild:
    if: github.ref_name != 'main' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout typography branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python font tools
        run: python -m pip install --disable-pip-version-check --upgrade fonttools brotli

      - name: Build canonical Reading fonts from official sources
        run: python scripts/build-reading-font-subsets.py

      - name: Verify unified Reading font coverage
        run: python scripts/check-reading-font-coverage.py

      - name: Commit changed canonical fonts when needed
        run: |
          rm -rf scripts/__pycache__
          if git diff --quiet -- assets/fonts/source-han-serif-tc-reading.woff2 assets/fonts/qiji-reading-title.woff2 assets/fonts/hanamin-reading-rare.woff2; then
            echo "Canonical Reading fonts already match the current corpus."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fonts/source-han-serif-tc-reading.woff2 assets/fonts/qiji-reading-title.woff2 assets/fonts/hanamin-reading-rare.woff2
          git commit -m "chore(reading): refresh canonical typography assets [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
