name: Reading Typography Maintenance

on:
  workflow_dispatch:
  # Bootstrap trigger for this migration branch only; removed before merge.
  push:
    branches:
      - work/reading-source-han-unification
    paths:
      - ".github/workflows/reading-typography-maintenance.yml"

permissions:
  contents: write

concurrency:
  group: reading-typography-maintenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rebuild:
    if: github.ref_name != 'main' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout typography branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python font tools
        run: python -m pip install --disable-pip-version-check --upgrade fonttools brotli

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install site tools
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Migrate Reading source tree
        run: |
          python scripts/migrate-reading-source-han.py
          rm -f scripts/migrate-reading-source-han.py

      - name: Build canonical Reading fonts from official sources
        run: python scripts/build-reading-font-subsets.py

      - name: Verify unified Reading font coverage
        run: python scripts/check-reading-font-coverage.py

      - name: Verify JavaScript syntax
        run: node --check reading/reading.js

      - name: Rebuild discovery assets
        run: npm run build:discovery

      - name: Prepare final maintenance tree
        run: |
          rm -rf scripts/__pycache__
          git status --short

      - name: Commit generated typography tree locally
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "ERROR: typography maintenance produced no changes"; exit 1; }
          git commit -m "fix(reading): unify Chinese typography on Source Han Serif TC [skip ci]"

      - name: Verify discovery is reproducible after commit
        run: node scripts/verify-generated-discovery.mjs

      - name: Re-verify committed font assets
        run: |
          python scripts/check-reading-font-coverage.py
          git status --porcelain

      - name: Push typography maintenance commit
        run: git push origin HEAD:${{ github.ref_name }}
