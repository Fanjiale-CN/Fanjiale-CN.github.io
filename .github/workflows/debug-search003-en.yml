name: Debug Research 003 English overlay
on:
  push:
    branches: [fix/live-regressions-20260830]
    paths: [.github/workflows/debug-search003-en.yml]
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Decode candidate overlay
        env:
          OVERLAY_GZ_B64: ""
        run: |
          python3 - <<'PY'
          import os,base64,gzip
          open('/tmp/overlay.js','wb').write(gzip.decompress(base64.b64decode(os.environ['OVERLAY_GZ_B64'])))
          PY
      - name: Print remaining CJK fields
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import vm from 'node:vm';
          const ctx={window:{}}; ctx.window.window=ctx.window; vm.createContext(ctx);
          vm.runInContext(fs.readFileSync('research/love-by-the-hour/search003-data.js','utf8'),ctx);
          vm.runInContext(fs.readFileSync('/tmp/overlay.js','utf8'),ctx);
          const d=ctx.window.SEARCH003_DATA, rows=[];
          d.accounts.forEach(a=>['name','followersLabel','membersLabel','size','orgLabel','monetization','acquisition'].forEach(k=>rows.push([`account:${a.id}:${k}`,a[k]])));
          (d.features||[]).forEach((x,i)=>rows.push([`feature:${i}`,x.label]));
          (d.orgBySize||[]).forEach((x,i)=>rows.push([`orgBySize:${i}`,x.size]));
          (d.pricing||[]).forEach((x,i)=>{rows.push([`pricing:${i}:type`,x.type]);rows.push([`pricing:${i}:item`,x.item]);});
          (d.timeline||[]).forEach((x,i)=>['label','time','detail'].forEach(k=>rows.push([`timeline:${i}:${k}`,x[k]])));
          (d.paths||[]).forEach((x,i)=>{rows.push([`path:${i}:title`,x.title]);(x.stages||[]).forEach((v,j)=>rows.push([`path:${i}:stage:${j}`,v]));(x.accounts||[]).forEach((v,j)=>rows.push([`path:${i}:account:${j}`,v]));});
          const bad=rows.filter(([,v])=>/[\u3400-\u9fff]/u.test(String(v??'')));
          console.log(JSON.stringify(bad,null,2));
          NODE
