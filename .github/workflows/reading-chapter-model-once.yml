name: Reading chapter model release once

on:
  push:
    branches:
      - feat/reading-salt-iron-chapter-model-20260831
    paths:
      - .github/workflows/reading-chapter-model-once.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/reading-salt-iron-chapter-model-20260831
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies without mutating lockfile
        run: npm install --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Refresh discovery assets
        run: npm run build:discovery
      - name: Commit generated discovery assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pagefind feed.xml sitemap.xml index/search-catalog.json
          if ! git diff --cached --quiet; then git commit -m "Refresh discovery for Salt and Iron chapter model"; fi
      - name: Run release gate
        run: npm run release
      - name: Remove one-time workflow
        run: |
          rm .github/workflows/reading-chapter-model-once.yml
          git add -A
          git commit -m "Remove one-time Reading chapter workflow"
      - name: Push validated branch
        run: git push origin HEAD:feat/reading-salt-iron-chapter-model-20260831
