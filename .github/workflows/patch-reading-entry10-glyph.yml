name: Patch Reading Entry 10 Glyph

on:
  push:
    paths:
      - ".github/workflows/patch-reading-entry10-glyph.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace unsupported variant glyph
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('reading/dongjing-meng-hua-lu/10/index.html')
          s = p.read_text(encoding='utf-8')
          if '薑豉𠝝子' not in s:
              raise SystemExit('Target glyph sequence not found')
          p.write_text(s.replace('薑豉𠝝子', '薑豉類子'), encoding='utf-8')
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/patch-reading-entry10-glyph.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reading/dongjing-meng-hua-lu/10/index.html .github/workflows/patch-reading-entry10-glyph.yml
          git commit -m "fix(reading): use supported Entry 10 text variant [skip ci]"
          git push
