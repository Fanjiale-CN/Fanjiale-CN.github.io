name: Finalize Dongjing 06 once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-dongjing-06-once.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Update Volume I navigation and status
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('reading/dongjing-meng-hua-lu/index.html')
          s = p.read_text(encoding='utf-8')
          old = '<article class="dj-toc-row is-pending"><span>06</span><div><h3>Outer Departments<small lang="zh-Hant">外諸司</small></h3></div><span class="dj-note">Warehouses, workshops, animals, fuel, grain depots and the administrative metabolism outside the palace.</span><span class="dj-state">NEXT</span><span class="dj-time">—</span></article>'
          new = '<a class="dj-toc-row is-live" href="/reading/dongjing-meng-hua-lu/06/"><span>06</span><div><h3>Outer Departments<small lang="zh-Hant">外諸司</small></h3></div><span class="dj-note">Workshops, animals, fuel, fifty-plus granaries, fodder yards and the labor that kept the capital supplied.</span><span class="dj-state">LIVE</span><span class="dj-time">≈ 14 MIN</span></a>'
          if old not in s:
              raise SystemExit('Could not find pending Entry 06 row')
          s = s.replace(old, new)
          s = s.replace('<p>5 / 6 LIVE</p></article>', '<p>6 / 6 LIVE</p></article>', 1)
          s = s.replace('<footer class="dj-footer"><span>READING / 003 / 5 OF 86 LIVE</span>', '<footer class="dj-footer"><span>READING / 003 / 6 OF 86 LIVE</span>')
          s = s.replace('Six entries build the spatial skeleton before the book turns toward streets and daily commerce.', 'All six entries are now live: walls, old city, waterways, palace and the supply bureaucracy form the spatial and logistical skeleton before Volume II turns toward streets and daily commerce.')
          p.write_text(s, encoding='utf-8')

          p = Path('reading/dongjing-meng-hua-lu/05/index.html')
          s = p.read_text(encoding='utf-8')
          old = '<span><small>NEXT / 06</small><strong>外諸司 / Outer Departments</strong></span>'
          new = '<a href="/reading/dongjing-meng-hua-lu/06/"><small>NEXT / 06</small><strong>外諸司 / Outer Departments</strong></a>'
          if old not in s:
              raise SystemExit('Could not find Entry 05 next navigation')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY

      - name: Install font tooling
        run: python -m pip install --disable-pip-version-check "fonttools[woff]" brotli

      - name: Fetch official GenRyu TW Regular
        run: |
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/ButTaiwan/genryu-font/v2.100/otf/TW/GenRyuMin2TW-R.otf" \
            --output /tmp/genryu-tw-regular.otf

      - name: Rebuild complete Reading subset
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.skip=0; self.parts=[]
              def handle_starttag(self, tag, attrs):
                  if tag in {'script','style','template','noscript'}: self.skip += 1
              def handle_endtag(self, tag):
                  if tag in {'script','style','template','noscript'} and self.skip: self.skip -= 1
              def handle_data(self, data):
                  if not self.skip: self.parts.append(data)

          chars=set('，。！？；：「」『』（）《》〈〉—…·、〔〕【】﹁﹂﹃﹄　')
          for path in Path('reading').rglob('*.html'):
              parser=P(); parser.feed(path.read_text(encoding='utf-8', errors='ignore'))
              for ch in ''.join(parser.parts):
                  cp=ord(ch)
                  if 0x3400 <= cp <= 0x4DBF or 0x4E00 <= cp <= 0x9FFF or 0xF900 <= cp <= 0xFAFF or 0x20000 <= cp <= 0x2FA1F:
                      chars.add(ch)
          Path('/tmp/genryu-reading-chars.txt').write_text(''.join(sorted(chars)), encoding='utf-8')
          print('Reading corpus:', len(chars), 'characters')
          PY

          pyftsubset /tmp/genryu-tw-regular.otf \
            --text-file=/tmp/genryu-reading-chars.txt \
            --output-file=/tmp/genryu-reading-tw.woff2 \
            --flavor=woff2 \
            --layout-features='*' \
            --glyph-names --symbol-cmap --legacy-cmap \
            --notdef-glyph --notdef-outline --recommended-glyphs

          python - <<'PY'
          from fontTools.ttLib import TTFont
          src='/tmp/genryu-reading-tw.woff2'; out='assets/fonts/genryu-reading-tw.woff2'
          font=TTFont(src); names=font['name']
          replacements={1:'Galok Reading Serif TW',2:'Regular',4:'Galok Reading Serif TW Regular',6:'GalokReadingSerifTW-Regular',16:'Galok Reading Serif TW',17:'Regular'}
          for name_id,value in replacements.items():
              for platform_id,encoding_id,language_id in ((3,1,0x409),(1,0,0)):
                  names.setName(value,name_id,platform_id,encoding_id,language_id)
          font.flavor='woff2'; font.save(out)
          PY

      - name: Enforce 100 percent cmap coverage
        run: python scripts/check-reading-font-coverage.py

      - name: Bust Reading font caches
        run: |
          python - <<'PY'
          from pathlib import Path
          css=Path('reading/dongjing.css')
          s=css.read_text(encoding='utf-8')
          s=s.replace('genryu-reading-tw.woff2?v=20260831f','genryu-reading-tw.woff2?v=20260831g')
          css.write_text(s,encoding='utf-8')
          for path in Path('reading/dongjing-meng-hua-lu').rglob('*.html'):
              t=path.read_text(encoding='utf-8')
              t=t.replace('/reading/dongjing.css?v=20260831b','/reading/dongjing.css?v=20260831c')
              path.write_text(t,encoding='utf-8')
          PY

      - name: Commit Volume I completion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reading/dongjing-meng-hua-lu reading/dongjing.css assets/fonts/genryu-reading-tw.woff2
          git commit -m "Complete Dongjing Meng Hua Lu Volume I"
          git push origin HEAD:main
