name: Vendor Qiji Reading font

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vendor-qiji-reading-font.yml"

permissions:
  contents: write

jobs:
  vendor-font:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install font tooling
        run: python -m pip install --disable-pip-version-check "fonttools[woff]" brotli

      - name: Fetch official Qiji release
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/LingDong-/qiji-font/releases/download/0.0.4/qiji.woff2" \
            --output /tmp/qiji.woff2

      - name: Build Galok Reading subset
        shell: bash
        run: |
          mkdir -p assets/fonts
          pyftsubset /tmp/qiji.woff2 \
            --text="鹽鐵論管子東京夢華錄" \
            --output-file=/tmp/qiji-reading-title.woff2 \
            --flavor=woff2 \
            --layout-features='*' \
            --glyph-names \
            --symbol-cmap \
            --legacy-cmap \
            --notdef-glyph \
            --notdef-outline \
            --recommended-glyphs

          python - <<'PY'
          from fontTools.ttLib import TTFont
          path = "/tmp/qiji-reading-title.woff2"
          font = TTFont(path)
          names = font["name"]
          replacements = {
              1: "Galok Reading Title",
              2: "Regular",
              4: "Galok Reading Title Regular",
              6: "GalokReadingTitle-Regular",
              16: "Galok Reading Title",
              17: "Regular",
          }
          for name_id, value in replacements.items():
              for platform_id, encoding_id, language_id in ((3, 1, 0x409), (1, 0, 0)):
                  names.setName(value, name_id, platform_id, encoding_id, language_id)
          font.flavor = "woff2"
          font.save("assets/fonts/qiji-reading-title.woff2")
          PY

          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/LingDong-/qiji-font/master/LICENSE" \
            --output assets/fonts/qiji-reading-title.LICENSE.txt

      - name: Switch Reading to same-origin font
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("reading/redesign-20260831.css")
          css = path.read_text(encoding="utf-8")
          start = 'src:url("https://webfont.shenzilong.cn/api?font='
          if start not in css:
              raise SystemExit("Expected external Qiji font source was not found")
          import re
          css, count = re.subn(
              r'src:url\("https://webfont\.shenzilong\.cn/api\?font=[^\"]+"\) format\("woff2"\);',
              'src:url("/assets/fonts/qiji-reading-title.woff2") format("woff2");',
              css,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"Expected exactly one font source replacement, got {count}")
          path.write_text(css, encoding="utf-8")
          PY

      - name: Commit self-hosted font
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fonts/qiji-reading-title.woff2 assets/fonts/qiji-reading-title.LICENSE.txt reading/redesign-20260831.css
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Self-host Qiji Reading title font"
          git push origin HEAD:main
