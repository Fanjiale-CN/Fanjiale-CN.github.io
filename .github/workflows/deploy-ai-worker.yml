name: Deploy Galok AI Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/galok-ai/**"
      - ".github/workflows/deploy-ai-worker.yml"
  pull_request:
    branches: [main]
    paths:
      - "workers/galok-ai/**"
      - ".github/workflows/deploy-ai-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: galok-ai-worker-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    name: Validate and deploy AI Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers/galok-ai

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate Worker source syntax
        run: node --check worker.js

      - name: Build Worker bundle without publishing
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/galok-npm-cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/galok-wrangler-config
        run: npx --yes wrangler deploy --dry-run --outdir "$RUNNER_TEMP/galok-ai-worker-dry-run"

      - name: Detect Cloudflare credentials
        if: github.event_name != 'pull_request'
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Galok AI Worker validated but deployment was skipped because Cloudflare credentials are not configured."
          fi

      - name: Deploy Galok AI Worker
        if: github.event_name != 'pull_request' && steps.credentials.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NPM_CONFIG_CACHE: ${{ runner.temp }}/galok-npm-cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/galok-wrangler-config
        run: npx --yes wrangler deploy

      - name: Verify production route
        if: github.event_name != 'pull_request' && steps.credentials.outputs.ready == 'true'
        working-directory: .
        shell: bash
        run: |
          body_file="$RUNNER_TEMP/galok-ai-health-body"
          error_file="$RUNNER_TEMP/galok-ai-health-error"

          for attempt in 1 2 3 4 5 6; do
            code="$(curl \
              --max-time 15 \
              --silent \
              --show-error \
              --output "$body_file" \
              --write-out '%{http_code}' \
              https://www.galok.me/api/ask \
              2>"$error_file" || true)"

            echo "Galok AI health attempt $attempt: HTTP ${code:-000}"
            if [[ "$code" == "200" ]] \
              && grep -q '"version":"context-surfaces-0.5"' "$body_file" \
              && grep -q '"provider":"deepseek"' "$body_file" \
              && grep -q '"model":"deepseek-v4-flash"' "$body_file" \
              && grep -q '"streaming":true' "$body_file" \
              && grep -q '"thinking":false' "$body_file" \
              && grep -q '"knowledge_mode":"context-plus-general"' "$body_file" \
              && grep -q '"abuse_protection":true' "$body_file" \
              && grep -q '"web_search":false' "$body_file"; then
              echo "Galok AI 0.5 is live on DeepSeek V4 Flash with the budget guard enabled."
              break
            fi

            if [[ "$attempt" == "6" ]]; then
              echo "Galok AI production route did not expose the expected DeepSeek health response."
              echo "--- response body ---"
              cat "$body_file" || true
              echo
              echo "--- curl diagnostics ---"
              cat "$error_file" || true
              exit 1
            fi
            sleep 5
          done

          smoke_file="$RUNNER_TEMP/galok-ai-smoke-body"
          smoke_code="$(curl \
            --max-time 45 \
            --silent \
            --show-error \
            --no-buffer \
            --output "$smoke_file" \
            --write-out '%{http_code}' \
            -H 'Content-Type: application/json' \
            -H 'Accept: text/event-stream' \
            --data '{"city":"beijing","question":"Reply with only: OK"}' \
            https://www.galok.me/api/ask || true)"

          echo "Galok AI provider smoke test: HTTP ${smoke_code:-000}"
          if [[ "$smoke_code" != "200" ]] || ! grep -q 'event: done' "$smoke_file"; then
            echo "DeepSeek production smoke test failed."
            cat "$smoke_file" || true
            exit 1
          fi

          echo "DeepSeek production smoke test passed."
