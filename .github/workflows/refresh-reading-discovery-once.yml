name: Refresh Reading discovery assets once

on:
  push:
    branches:
      - feat/reading-v1-20260830
    paths:
      - .github/workflows/refresh-reading-discovery-once.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install CI tools
        run: npm ci --ignore-scripts
      - name: Regenerate discovery
        run: npm run build:discovery
      - name: Verify native site
        run: node scripts/validate-site.mjs
      - name: Remove one-time workflow
        run: rm .github/workflows/refresh-reading-discovery-once.yml
      - name: Commit refreshed discovery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refresh Reading discovery assets'
          git push origin HEAD:feat/reading-v1-20260830
