name: TEMP Promote Dongjing Entry 18

on:
  push:
    branches:
      - tmp/reading-canonical-build-20260902

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v7
        with:
          ref: tmp/reading-canonical-build-20260902
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install tools
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          python -m pip install --disable-pip-version-check --upgrade fonttools brotli

      - name: Promote Entry 18 and connect Volume III navigation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if s.count(old) != 1:
                  raise SystemExit(f'{path}: expected one match for {old!r}, got {s.count(old)}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          entry18 = Path('reading/dongjing-meng-hua-lu/18/index.html')
          s = entry18.read_text(encoding='utf-8')
          marker = '  <meta name="robots" content="noindex,follow">\n'
          search_meta = '  <meta name="galok:search" content="include">\n'
          if search_meta not in s:
              if marker not in s:
                  raise SystemExit('Entry 18 robots marker missing')
              s = s.replace(marker, marker + search_meta, 1)
          if s.count('<span>REVIEW</span>') != 1:
              raise SystemExit('Entry 18 REVIEW marker mismatch')
          s = s.replace('<span>REVIEW</span>', '<span>LIVE</span>', 1)
          entry18.write_text(s, encoding='utf-8')

          room = 'reading/dongjing-meng-hua-lu/index.html'
          replace_once(room, 'VOLUME III / 3 OF 13', 'VOLUME III / 4 OF 13')
          replace_once(room, 'Ten volumes. Seventeen entries live.', 'Ten volumes. Eighteen entries live.')
          replace_once(room, '<b>HOW THE CITY WORKS</b><small>IN PROGRESS / SPECIALISTS + STATE + ARRIVAL</small>', '<b>HOW THE CITY WORKS</b><small>IN PROGRESS / SPECIALISTS + STATE + ARRIVAL + TEMPLE MARKET</small>')
          replace_once(room, '<span class="dj-drawer-progress">3 / 13</span>', '<span class="dj-drawer-progress">4 / 13</span>')
          replace_once(room, 'Volume III begins with medical specialization, the western government edge and a lodging corridor for arrivals. Next, the reader walks through Xiangguo Temple into a periodic market system.', 'Volume III begins with medical specialization, the western government edge and a lodging corridor for arrivals, then walks through Xiangguo Temple as a periodic market layered inside a religious complex.')
          old18 = '<div class="dj-drawer-entry is-queued"><span>18</span><span class="dj-drawer-entry-title"><strong>Xiangguo Temple Market</strong><small lang="zh-Hant">相國寺內萬姓交易</small></span><span class="dj-drawer-entry-note">Periodic trade moves gate by gate through a religious complex.</span><span class="dj-drawer-entry-state">NEXT</span><span class="dj-drawer-entry-time">—</span></div>'
          new18 = '<a class="dj-drawer-entry" href="/reading/dongjing-meng-hua-lu/18/"><span>18</span><span class="dj-drawer-entry-title"><strong>Xiangguo Temple Market</strong><small lang="zh-Hant">相國寺內萬姓交易</small></span><span class="dj-drawer-entry-note">Periodic trade moves gate by gate through a religious complex without erasing its ritual core.</span><span class="dj-drawer-entry-state">LIVE</span><span class="dj-drawer-entry-time">≈ 24 MIN</span></a>'
          replace_once(room, old18, new18)

          entry17 = 'reading/dongjing-meng-hua-lu/17/index.html'
          oldnav = '<span><small>NEXT / QUEUED</small><strong>18 / 相國寺內萬姓交易</strong></span>'
          newnav = '<a href="/reading/dongjing-meng-hua-lu/18/"><small>NEXT</small><strong>18 / 相國寺內萬姓交易</strong></a>'
          replace_once(entry17, oldnav, newnav)
          PY

      - name: Keep temporary workflow out of content commit
        run: git checkout HEAD -- .github/workflows/rebuild-reading-fonts-once.yml

      - name: Verify typography remains valid
        run: python scripts/check-reading-font-coverage.py

      - name: Rebuild discovery for newly live Entry 18
        run: npm run build:discovery

      - name: Commit promoted content locally
        run: |
          rm -rf scripts/__pycache__
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "ERROR: promotion produced no changes"; exit 1; }
          git commit -m "chore(temp): promote Dongjing Entry 18 [skip ci]"

      - name: Verify generated discovery is reproducible
        run: node scripts/verify-generated-discovery.mjs

      - name: Confirm Entry 18 is now searchable
        run: |
          test "$(node -e "const d=require('./index/search-catalog.json'); console.log(d.some(x=>String(x.url||'').includes('/reading/dongjing-meng-hua-lu/18/')) ? 'yes' : 'no')")" = "yes"
          git status --porcelain

      - name: Push promoted content to helper branch
        run: git push origin HEAD:tmp/reading-canonical-build-20260902
