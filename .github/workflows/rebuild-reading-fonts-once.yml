name: Rebuild Reading Artifacts

on:
  push:
    paths:
      - "reading/**/*.html"
      - "scripts/build-reading-font-subsets.py"
      - "scripts/check-reading-font-coverage.py"
      - "scripts/build-discovery.mjs"
      - "scripts/runtime-discovery-search.mjs"
      - "scripts/validate-discovery.mjs"
      - ".github/workflows/rebuild-reading-fonts-once.yml"

permissions:
  contents: write

concurrency:
  group: reading-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install font tools
        run: python -m pip install --disable-pip-version-check --upgrade fonttools brotli
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install site tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build Reading font subsets
        run: python scripts/build-reading-font-subsets.py
      - name: Verify Reading serif stack
        run: python scripts/check-reading-font-coverage.py
      - name: Rebuild discovery assets
        run: npm run build:discovery
      - name: Commit generated Reading artifacts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            assets/fonts/genryu-reading-tw.woff2 \
            assets/fonts/qiji-reading-title.woff2 \
            assets/fonts/hanamin-reading-rare.woff2 \
            sitemap.xml \
            feed.xml \
            index/search-catalog.json \
            pagefind
          if git diff --cached --quiet; then
            echo "No generated Reading artifact changes."
            exit 0
          fi
          git commit -m "chore(reading): rebuild fonts and discovery"
          git push
