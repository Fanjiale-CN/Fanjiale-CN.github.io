name: Verify Reading Artifacts

on:
  pull_request:
    branches: [main]
    paths:
      - "reading/**/*.html"
      - "reading/**/*.css"
      - "reading/**/*.js"
      - "assets/fonts/**"
      - "scripts/build-reading-font-subsets.py"
      - "scripts/check-reading-font-coverage.py"
      - "scripts/build-discovery.mjs"
      - "scripts/verify-generated-discovery.mjs"
      - "scripts/runtime-discovery-search.mjs"
      - "scripts/validate-discovery.mjs"
      - ".github/workflows/rebuild-reading-fonts-once.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-reading-artifacts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install font tools
        run: python -m pip install --disable-pip-version-check --upgrade fonttools brotli

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install site tools
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Rebuild Reading font subsets in CI workspace
        run: python scripts/build-reading-font-subsets.py

      - name: Verify Reading serif stack coverage
        run: python scripts/check-reading-font-coverage.py

      - name: Verify committed font artifacts are current
        run: |
          git diff --exit-code -- \
            assets/fonts/genryu-reading-tw.woff2 \
            assets/fonts/qiji-reading-title.woff2 \
            assets/fonts/hanamin-reading-rare.woff2

      - name: Rebuild and verify discovery assets
        run: |
          npm run build:discovery
          node scripts/verify-generated-discovery.mjs

      - name: Explain stale-artifact failures
        if: failure()
        run: |
          echo "Reading artifacts are validation outputs, not bot-authored commits."
          echo "Before pushing a Reading change, run:"
          echo "  python scripts/build-reading-font-subsets.py"
          echo "  python scripts/check-reading-font-coverage.py"
          echo "  npm run build:discovery"
          echo "  node scripts/verify-generated-discovery.mjs"
