name: TEMP Finalize Reading Canonical Tree

on:
  push:
    branches:
      - tmp/reading-canonical-build-20260902

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v7
        with:
          ref: tmp/reading-canonical-build-20260902
          fetch-depth: 0

      - name: Install font tools
        run: python -m pip install --disable-pip-version-check --upgrade fonttools brotli

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install site tools
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Finalize canonical Reading tree
        run: python scripts/helper-finalize-reading.py

      - name: Fix checker self-scan
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/check-reading-font-coverage.py')
          s = p.read_text(encoding='utf-8')
          old = '''        for path in base.rglob("*"):\n            if not path.is_file() or path.suffix.lower() not in {".html", ".css", ".js", ".mjs", ".py", ".yml", ".yaml"}:\n'''
          new = '''        for path in base.rglob("*"):\n            if path.resolve() == Path(__file__).resolve():\n                continue\n            if not path.is_file() or path.suffix.lower() not in {".html", ".css", ".js", ".mjs", ".py", ".yml", ".yaml"}:\n'''
          if s.count(old) != 1:
              raise SystemExit('checker self-scan patch target mismatch')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Keep helper workflow out of generated commit
        run: |
          git checkout HEAD -- .github/workflows/rebuild-reading-fonts-once.yml
          rm -rf scripts/__pycache__

      - name: Verify canonical blob hashes are unchanged
        run: |
          test "$(git hash-object assets/fonts/genryu-reading-tw.woff2)" = "8cce61b0a81aef63fddf5bc83d08bc64a9c289dc"
          test "$(git hash-object assets/fonts/qiji-reading-title.woff2)" = "122f8a4b46e8f52433a58a0e071d1cfeb0252d70"
          test "$(git hash-object assets/fonts/hanamin-reading-rare.woff2)" = "b7dce39cd84dd60f02a75518f164ea9f0c66360e"

      - name: Verify Python and JavaScript syntax
        run: |
          python -m py_compile scripts/check-reading-font-coverage.py scripts/build-reading-font-subsets.py
          node --check reading/dongjing-08.js
          rm -rf scripts/__pycache__

      - name: Verify canonical Reading font coverage
        run: python scripts/check-reading-font-coverage.py

      - name: Rebuild discovery assets
        run: npm run build:discovery

      - name: Commit finalized content tree locally
        run: |
          rm -rf scripts/__pycache__
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "ERROR: finalizer produced no changes"; exit 1; }
          git commit -m "chore(temp): finalize canonical Reading content [skip ci]"

      - name: Verify discovery is reproducible from committed tree
        run: node scripts/verify-generated-discovery.mjs

      - name: Re-verify canonical hashes after commit
        run: |
          test "$(git hash-object assets/fonts/genryu-reading-tw.woff2)" = "8cce61b0a81aef63fddf5bc83d08bc64a9c289dc"
          test "$(git hash-object assets/fonts/qiji-reading-title.woff2)" = "122f8a4b46e8f52433a58a0e071d1cfeb0252d70"
          test "$(git hash-object assets/fonts/hanamin-reading-rare.woff2)" = "b7dce39cd84dd60f02a75518f164ea9f0c66360e"
          test -z "$(git status --porcelain)"

      - name: Push finalized content tree to helper branch
        run: git push origin HEAD:tmp/reading-canonical-build-20260902
