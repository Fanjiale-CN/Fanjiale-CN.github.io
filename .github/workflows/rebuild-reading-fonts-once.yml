name: TEMP Build Reading Canonical Fonts

on:
  push:
    branches:
      - tmp/reading-canonical-build-20260902

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v7
        with:
          ref: tmp/reading-canonical-build-20260902
          fetch-depth: 0

      - name: Install font tools
        run: python -m pip install --disable-pip-version-check --upgrade fonttools brotli

      - name: Build and validate three canonical Reading fonts
        run: python scripts/helper-rebuild-reading-canonical.py

      - name: Prove only canonical font binaries changed
        run: |
          git status --short
          test -f assets/fonts/genryu-reading-tw.woff2
          test -f assets/fonts/qiji-reading-title.woff2
          test -f assets/fonts/hanamin-reading-rare.woff2

      - name: Commit generated canonical fonts to helper branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            assets/fonts/genryu-reading-tw.woff2 \
            assets/fonts/qiji-reading-title.woff2 \
            assets/fonts/hanamin-reading-rare.woff2
          git diff --cached --exit-code && { echo "ERROR: canonical build produced no changes"; exit 1; } || true
          git commit -m "chore(temp): build canonical Reading fonts [skip ci]"
          git push origin HEAD:tmp/reading-canonical-build-20260902
