name: Xi'an Time Strata Preflight

on:
  push:
    branches:
      - work/xian-time-strata-20260829

permissions:
  contents: write

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[xian-time-built]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/xian-time-strata-20260829
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install release tools
        run: npm ci --ignore-scripts
      - name: Run release
        run: npm run release
      - name: Commit validated release output
        run: |
          rm -f .github/workflows/xian-time-preflight.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "Build Xi'an time strata [xian-time-built]"
          git push origin HEAD:work/xian-time-strata-20260829
