name: Xi'an Syntax Fix Preflight

on:
  push:
    branches:
      - work/xian-syntax-fix-20260829

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Fix Xi'an time reader and bust cache keys
        run: |
          python - <<'PY'
          from pathlib import Path
          OLD = "20260829-strata2"
          NEW = "20260829-strata3"

          replacements = {
              "be-a-viewer/xian/index.html": [
                  (f'src="/be-a-viewer/xian/xian.js?v={OLD}"', f'src="/be-a-viewer/xian/xian.js?v={NEW}"')
              ],
              "be-a-viewer/xian/xian.js": [
                  (f'void import("/be-a-viewer/xian/xian-history.js?v={OLD}").catch(() => {{}});', f'void import("/be-a-viewer/xian/xian-history.js?v={NEW}").catch((error) => console.error("Xi’an history module failed", error));')
              ],
              "be-a-viewer/xian/xian-history.js": [
                  (f'const VERSION = "{OLD}";', f'const VERSION = "{NEW}";'),
                  (f'void import("/be-a-viewer/xian/xian-time.js?v={OLD}").catch(() => {{}});', f'void import("/be-a-viewer/xian/xian-time.js?v={NEW}").catch((error) => console.error("Xi’an time module failed", error));')
              ],
              "be-a-viewer/xian/xian-time.js": [
                  (f'const VERSION = "{OLD}";', f'const VERSION = "{NEW}";'),
                  ('${index === 0 ? " is-active" : "}', '${index === 0 ? " is-active" : ""}')
              ],
              "scripts/validate-xian-history.mjs": [
                  (f'xian-time.js?v={OLD}', f'xian-time.js?v={NEW}')
              ]
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"missing expected patch marker in {filename}: {old}")
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY
      - name: Check Xi'an JavaScript syntax
        run: |
          node --check be-a-viewer/xian/xian-time.js
          node --check be-a-viewer/xian/xian-history.js
          node --check be-a-viewer/xian/xian.js
          node --check be-a-viewer/xian/xian-motion.js
      - name: Install release tools
        run: npm ci --ignore-scripts
      - name: Run release
        run: npm run release
      - name: Commit validated Xi'an syntax fix
        run: |
          rm -f .github/workflows/xian-syntax-fix-preflight.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Xi'an time reader syntax fix [xian-syntax-final]"
          git push origin HEAD:work/xian-syntax-fix-20260829
