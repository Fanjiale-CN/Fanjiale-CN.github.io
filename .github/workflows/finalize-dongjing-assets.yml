name: Finalize Dongjing assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-dongjing-assets.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install font tooling
        run: python -m pip install --disable-pip-version-check "fonttools[woff]" brotli

      - name: Expand Qiji title subset
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/LingDong-/qiji-font/releases/download/0.0.4/qiji-combo.woff2" \
            --output /tmp/qiji-combo.woff2
          printf '%s' '鹽鐵論管子東京夢華錄東都外城舊京城河道大內諸司' > /tmp/qiji-reading-title-chars.txt
          pyftsubset /tmp/qiji-combo.woff2 \
            --text-file=/tmp/qiji-reading-title-chars.txt \
            --output-file=/tmp/qiji-reading-title.woff2 \
            --flavor=woff2 \
            --layout-features='*' \
            --glyph-names \
            --symbol-cmap \
            --legacy-cmap \
            --notdef-glyph \
            --notdef-outline \
            --recommended-glyphs
          python - <<'PY'
          from fontTools.ttLib import TTFont
          src = '/tmp/qiji-reading-title.woff2'
          out = 'assets/fonts/qiji-reading-title.woff2'
          font = TTFont(src)
          names = font['name']
          replacements = {
              1: 'Galok Reading Title',
              2: 'Regular',
              4: 'Galok Reading Title Regular',
              6: 'GalokReadingTitle-Regular',
              16: 'Galok Reading Title',
              17: 'Regular',
          }
          for name_id, value in replacements.items():
              for platform_id, encoding_id, language_id in ((3, 1, 0x409), (1, 0, 0)):
                  names.setName(value, name_id, platform_id, encoding_id, language_id)
          font.flavor = 'woff2'
          font.save(out)
          PY
          ls -lh assets/fonts/qiji-reading-title.woff2

      - name: Use Wikimedia thumbnails and bust title-font cache
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('reading/dongjing.css')
          css = css_path.read_text(encoding='utf-8')
          css = css.replace('/assets/fonts/qiji-reading-title.woff2")', '/assets/fonts/qiji-reading-title.woff2?v=20260831b")')
          css_path.write_text(css, encoding='utf-8')

          room_path = Path('reading/dongjing-meng-hua-lu/index.html')
          room = room_path.read_text(encoding='utf-8')
          old = '<figure class="dj-room-art"><img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Alongtheriver_QingMing.jpg" alt="Along the River During the Qingming Festival, attributed to Zhang Zeduan, showing Northern Song urban life" fetchpriority="high" decoding="async">'
          new = '<figure class="dj-room-art" data-commons-figure><img data-commons-title="File:Alongtheriver_QingMing.jpg" data-commons-width="1800" alt="Along the River During the Qingming Festival, attributed to Zhang Zeduan, showing Northern Song urban life" fetchpriority="high" decoding="async">'
          if old not in room:
              raise SystemExit('Room hero full-scroll image pattern missing')
          room = room.replace(old, new, 1)
          old = '<div class="dj-scroll-window"><img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Alongtheriver_QingMing.jpg" alt="Panoramic section of Along the River During the Qingming Festival" loading="lazy" decoding="async"></div>'
          new = '<div class="dj-scroll-window" data-commons-figure><img data-commons-title="File:Alongtheriver_QingMing.jpg" data-commons-width="2200" alt="Panoramic section of Along the River During the Qingming Festival" loading="lazy" decoding="async"></div>'
          if old not in room:
              raise SystemExit('Room scroll full-image pattern missing')
          room = room.replace(old, new, 1)
          room = room.replace('/reading/reading.js?v=20260831a', '/reading/reading.js?v=20260831e')
          room_path.write_text(room, encoding='utf-8')

          entry_path = Path('reading/dongjing-meng-hua-lu/01/index.html')
          entry = entry_path.read_text(encoding='utf-8')
          old = '<figure><img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Bianjing_city_gate.JPG" alt="City gate detail from Along the River During the Qingming Festival" loading="lazy" decoding="async">'
          new = '<figure data-commons-figure><img data-commons-title="File:Bianjing_city_gate.JPG" data-commons-width="1800" alt="City gate detail from Along the River During the Qingming Festival" loading="lazy" decoding="async">'
          if old not in entry:
              raise SystemExit('Entry gate full-image pattern missing')
          entry = entry.replace(old, new, 1)
          entry = entry.replace('/reading/reading.js?v=20260831a', '/reading/reading.js?v=20260831e')
          entry_path.write_text(entry, encoding='utf-8')
          PY

      - name: Commit final assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fonts/qiji-reading-title.woff2 reading/dongjing.css reading/dongjing-meng-hua-lu/index.html reading/dongjing-meng-hua-lu/01/index.html
          git commit -m "Finalize Dongjing fonts and visual loading"
          git push origin HEAD:main
