name: Galok Site Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: galok-site-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate site release gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install CI tools
        run: npm ci --ignore-scripts

      - name: Build and verify discovery assets
        id: discovery
        continue-on-error: true
        run: |
          npm run build:discovery
          git diff --exit-code -- sitemap.xml feed.xml index/search-catalog.json pagefind/build.json

      - name: Run repository validators first
        id: native
        continue-on-error: true
        run: node scripts/validate-site.mjs

      - name: Validate City Atlas and reader contact platform
        id: experience
        continue-on-error: true
        run: npm run ci:experience

      - name: Validate HTML, routes, fragments and R2 media
        id: links
        continue-on-error: true
        run: node scripts/validate-runtime-links.mjs

      - name: Enforce resource budgets
        id: budget
        continue-on-error: true
        run: node scripts/check-resource-budgets.mjs

      - name: Start static site server
        run: |
          node scripts/serve-static.mjs > /tmp/galok-static-server.log 2>&1 &
          echo $! > /tmp/galok-static-server.pid
          for attempt in 1 2 3 4 5; do
            curl --fail --silent http://127.0.0.1:4173/ && exit 0
            sleep 1
          done
          cat /tmp/galok-static-server.log
          exit 1

      - name: Run browser accessibility audit
        id: runtime_a11y
        continue-on-error: true
        env:
          BASE_URL: http://127.0.0.1:4173
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/runtime-accessibility.mjs

      - name: Test full archive search
        id: runtime_search
        continue-on-error: true
        env:
          BASE_URL: http://127.0.0.1:4173
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/runtime-discovery-search.mjs

      - name: Verify analytics and Clarity runtime wiring
        id: runtime_observability
        continue-on-error: true
        env:
          BASE_URL: http://127.0.0.1:4173
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/runtime-observability.mjs

      - name: Verify Radar interactions and reduced motion
        id: runtime_radar
        continue-on-error: true
        env:
          BASE_URL: http://127.0.0.1:4173
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/runtime-radar.mjs

      - name: Measure Lighthouse baseline
        id: lighthouse
        continue-on-error: true
        run: npx lhci autorun

      - name: Write readable report
        if: always()
        run: node scripts/write-ci-report.mjs

      - name: Upload CI reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: galok-ci-report
          path: artifacts/ci
          if-no-files-found: warn

      - name: Enforce release gates
        if: always()
        run: |
          test "${{ steps.native.outcome }}" = "success"
          test "${{ steps.experience.outcome }}" = "success"
          test "${{ steps.links.outcome }}" = "success"
          test "${{ steps.budget.outcome }}" = "success"
          test "${{ steps.discovery.outcome }}" = "success"
          test "${{ steps.runtime_a11y.outcome }}" = "success"
          test "${{ steps.runtime_search.outcome }}" = "success"
          test "${{ steps.runtime_observability.outcome }}" = "success"
          test "${{ steps.runtime_radar.outcome }}" = "success"
          test "${{ steps.lighthouse.outcome }}" = "success"
