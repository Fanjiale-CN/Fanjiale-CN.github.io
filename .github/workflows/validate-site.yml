name: Galok Site Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: galok-site-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate site release gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install CI tools
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Reading font validator
        run: python -m pip install --disable-pip-version-check "fonttools[woff]" brotli

      # FAST GATES: deterministic and cheap. Any failure here stops browser/Lighthouse work.
      - name: Verify package and lockfile contract
        run: npm run check:package-contract

      - name: Verify stable workflow policy
        run: npm run check:workflow-policy

      - name: Verify Reading canonical font-stack coverage
        run: python scripts/check-reading-font-coverage.py

      - name: Rebuild and verify discovery assets
        run: |
          npm run build:discovery
          node scripts/verify-generated-discovery.mjs

      - name: Run lightweight release validators
        run: npm run release:core

      - name: Validate City Atlas and reader contact platform
        run: npm run ci:experience

      - name: Validate HTML, routes, fragments and R2 media
        run: npm run ci:links

      - name: Enforce resource budgets
        id: budget
        run: npm run ci:budget

      - name: Mark fast gates complete
        id: fast_complete
        run: echo "complete=true" >> "$GITHUB_OUTPUT"

      # RUNTIME GATES: only run after every deterministic fast gate passed.
      - name: Start static site server
        run: |
          node scripts/serve-static.mjs > /tmp/galok-static-server.log 2>&1 &
          echo $! > /tmp/galok-static-server.pid
          for attempt in 1 2 3 4 5; do
            curl --fail --silent http://127.0.0.1:4173/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/galok-static-server.log
          exit 1

      - name: Verify Reading display font resolution
        id: runtime_font
        continue-on-error: true
        env:
          BASE_URL: http://127.0.0.1:4173
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/runtime-reading-display-font.mjs

      - name: Run browser accessibility audit
        id: runtime_a11y
        continue-on-error: true
        env:
          BASE_URL: http://127.0.0.1:4173
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/runtime-accessibility.mjs

      - name: Test full archive search
        id: runtime_search
        continue-on-error: true
        env:
          BASE_URL: http://127.0.0.1:4173
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/runtime-discovery-search.mjs

      - name: Verify analytics and Clarity runtime wiring
        id: runtime_observability
        continue-on-error: true
        env:
          BASE_URL: http://127.0.0.1:4173
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/runtime-observability.mjs

      - name: Verify Radar interactions and reduced motion
        id: runtime_radar
        continue-on-error: true
        env:
          BASE_URL: http://127.0.0.1:4173
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/runtime-radar.mjs

      - name: Verify global styles across routes and viewports
        id: visual
        continue-on-error: true
        env:
          BASE_URL: http://127.0.0.1:4173
          CHROME_PATH: /usr/bin/google-chrome
          VISUAL_EVIDENCE_DIR: artifacts/ci/visual-acceptance
        run: npm run ci:visual

      - name: Measure Lighthouse baseline
        id: lighthouse
        continue-on-error: true
        run: npx lhci autorun

      - name: Write readable runtime report
        if: always() && steps.fast_complete.outcome == 'success'
        env:
          GALOK_GATE_FAST: success
          GALOK_GATE_RUNTIME_FONT: ${{ steps.runtime_font.outcome }}
          GALOK_GATE_A11Y: ${{ steps.runtime_a11y.outcome }}
          GALOK_GATE_SEARCH: ${{ steps.runtime_search.outcome }}
          GALOK_GATE_OBSERVABILITY: ${{ steps.runtime_observability.outcome }}
          GALOK_GATE_RADAR: ${{ steps.runtime_radar.outcome }}
          GALOK_GATE_VISUAL: ${{ steps.visual.outcome }}
          GALOK_GATE_LIGHTHOUSE: ${{ steps.lighthouse.outcome }}
        run: node scripts/write-ci-report.mjs

      - name: Upload CI reports
        if: always() && steps.fast_complete.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: galok-ci-report
          path: artifacts/ci
          if-no-files-found: warn

      - name: Enforce runtime release gates with failure list
        if: always() && steps.fast_complete.outcome == 'success'
        env:
          GALOK_GATE_RUNTIME_FONT: ${{ steps.runtime_font.outcome }}
          GALOK_GATE_A11Y: ${{ steps.runtime_a11y.outcome }}
          GALOK_GATE_SEARCH: ${{ steps.runtime_search.outcome }}
          GALOK_GATE_OBSERVABILITY: ${{ steps.runtime_observability.outcome }}
          GALOK_GATE_RADAR: ${{ steps.runtime_radar.outcome }}
          GALOK_GATE_VISUAL: ${{ steps.visual.outcome }}
          GALOK_GATE_LIGHTHOUSE: ${{ steps.lighthouse.outcome }}
        run: node scripts/enforce-ci-gates.mjs

      - name: Verify production routes after deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        env:
          BASE_URL: https://www.galok.me
          RELEASE_SHA: ${{ github.sha }}
          MAX_ATTEMPTS: "20"
          RETRY_DELAY_MS: "15000"
        run: node scripts/verify-production-routes.mjs
