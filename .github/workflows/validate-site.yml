name: Galok Site Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: galok-site-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate site release gates
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Publish-first release check
        run: echo "GALOK READY — repository-side release gates are disabled; publish first, refine after launch."
