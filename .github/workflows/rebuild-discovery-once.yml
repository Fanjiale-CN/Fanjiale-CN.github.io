name: Rebuild discovery once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rebuild-discovery-once.yml"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install CI tools
        run: npm ci --ignore-scripts

      - name: Rebuild discovery assets
        run: npm run build:discovery

      - name: Commit generated discovery assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml index/search-catalog.json pagefind
          if git diff --cached --quiet; then
            echo "Discovery assets are already current."
            exit 0
          fi
          git commit -m "Refresh generated discovery assets"
          git push origin HEAD:main
