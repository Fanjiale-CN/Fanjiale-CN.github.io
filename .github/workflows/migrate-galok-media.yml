name: Migrate Galok media to R2

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type MIGRATE_GALOK_MEDIA to upload media and prepare a review PR
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: galok-r2-media-migration
  cancel-in-progress: false

jobs:
  validate-confirmation:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          test "$CONFIRM" = "MIGRATE_GALOK_MEDIA" || {
            echo "Confirmation text did not match. No files were uploaded."
            exit 1
          }

  migrate:
    needs: validate-confirmation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Shanghai
      GALOK_RELEASE_TIMEZONE: Asia/Shanghai
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Create isolated migration branch
        env:
          BRANCH_NAME: ops/r2-media-migration-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          git fetch origin main
          git checkout -b "$BRANCH_NAME" origin/main
          echo "BRANCH_NAME=$BRANCH_NAME" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install repository tools
        run: npm ci --ignore-scripts

      - name: Show migration plan
        run: node scripts/migrate-media-edge.mjs

      - name: Require R2 credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN secret."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID secret."; exit 1; }

      - name: Upload, verify, and rewrite production references
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NPM_CONFIG_CACHE: ${{ runner.temp }}/galok-npm-cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/galok-wrangler-config
        run: node scripts/migrate-media-edge.mjs --apply

      - name: Verify published objects
        run: node scripts/migrate-media-edge.mjs --verify

      - name: Refresh generated discovery assets
        run: npm run build:discovery

      - name: Run release preflight on rewritten site
        run: node scripts/release-check.mjs

      - name: Commit verified reference changes
        id: commit
        env:
          BRANCH_NAME: ${{ env.BRANCH_NAME }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git add sitemap.xml feed.xml index/search-catalog.json pagefind reports/media-edge-migration-result.json
          if git diff --cached --quiet; then
            echo "No reference changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Migrate production media to R2"
          git push --set-upstream origin HEAD:"$BRANCH_NAME"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open migration pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ env.BRANCH_NAME }}
        run: |
          gh pr create             --base main             --head "$BRANCH_NAME"             --title "ops: review R2 media migration"             --body "This PR contains the verified production media reference changes prepared by the manual R2 migration workflow. Merge only after the required site validation and production deployment checks pass."
