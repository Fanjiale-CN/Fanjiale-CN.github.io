name: Install Dongjing volume drawers once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-dongjing-volume-drawers-once.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install drawer layout
        run: python scripts/install-dongjing-drawers-once.py

      - name: Install font tooling
        run: python -m pip install --disable-pip-version-check "fonttools[woff]" brotli

      - name: Fetch official GenRyu TW Regular
        run: |
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/ButTaiwan/genryu-font/v2.100/otf/TW/GenRyuMin2TW-R.otf" \
            --output /tmp/genryu-tw-regular.otf

      - name: Rebuild Reading font subset
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.skip = 0
                  self.parts = []
              def handle_starttag(self, tag, attrs):
                  if tag in {'script','style','template','noscript'}: self.skip += 1
              def handle_endtag(self, tag):
                  if tag in {'script','style','template','noscript'} and self.skip: self.skip -= 1
              def handle_data(self, data):
                  if not self.skip: self.parts.append(data)

          chars=set('，。！？；：「」『』（）《》〈〉—…·、〔〕【】﹁﹂﹃﹄　')
          for path in Path('reading').rglob('*.html'):
              p=P(); p.feed(path.read_text(encoding='utf-8', errors='ignore'))
              for ch in ''.join(p.parts):
                  cp=ord(ch)
                  if 0x3400 <= cp <= 0x4DBF or 0x4E00 <= cp <= 0x9FFF or 0xF900 <= cp <= 0xFAFF or 0x20000 <= cp <= 0x2FA1F:
                      chars.add(ch)
          Path('/tmp/genryu-reading-chars.txt').write_text(''.join(sorted(chars)), encoding='utf-8')
          print('Reading corpus:', len(chars), 'characters')
          PY

          pyftsubset /tmp/genryu-tw-regular.otf \
            --text-file=/tmp/genryu-reading-chars.txt \
            --output-file=/tmp/genryu-reading-tw.woff2 \
            --flavor=woff2 --layout-features='*' --glyph-names \
            --symbol-cmap --legacy-cmap --notdef-glyph --notdef-outline --recommended-glyphs

          python - <<'PY'
          from fontTools.ttLib import TTFont
          font=TTFont('/tmp/genryu-reading-tw.woff2')
          names=font['name']
          replacements={1:'Galok Reading Serif TW',2:'Regular',4:'Galok Reading Serif TW Regular',6:'GalokReadingSerifTW-Regular',16:'Galok Reading Serif TW',17:'Regular'}
          for name_id,value in replacements.items():
              for platform_id,encoding_id,language_id in ((3,1,0x409),(1,0,0)):
                  names.setName(value,name_id,platform_id,encoding_id,language_id)
          font.flavor='woff2'
          font.save('assets/fonts/genryu-reading-tw.woff2')
          PY

      - name: Enforce 100 percent Reading cmap coverage
        run: python scripts/check-reading-font-coverage.py

      - name: Bust font cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('reading/dongjing.css')
          s=p.read_text(encoding='utf-8').replace('genryu-reading-tw.woff2?v=20260831g','genryu-reading-tw.woff2?v=20260831h')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit drawer prototype
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reading/dongjing-meng-hua-lu reading/dongjing.css assets/fonts/genryu-reading-tw.woff2
          git commit -m "Prototype Dongjing volume archive drawers"
          git push origin HEAD:main
