name: Open Dongjing Reading
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/open-dongjing-reading.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Patch Reading index and preview state
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index = Path('reading/index.html')
          text = index.read_text(encoding='utf-8')
          pattern = r'<button class="reading-index-row" type="button" data-reading-preview="dongjing">\s*<span>—</span><span><b>DONGJING MENG HUA LU</b><small>東京夢華錄 / Eastern Capital</small></span><span>12th c\.</span><span>City / People</span><span>Research queue</span>\s*</button>'
          replacement = '''<a class="reading-index-row is-active" href="/reading/dongjing-meng-hua-lu/" data-reading-preview="dongjing">
            <span>003</span><span><b>DONGJING MENG HUA LU</b><small>東京夢華錄 / Eastern Capital</small></span><span>1147</span><span>City / People</span><span>Open dossier ↗</span>
          </a>'''
          text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Dongjing index row replacements: {count}')

          timeline = r'<article class="reading-time-item is-research">\s*<div class="reading-time-date"><strong>12th</strong><span>C\.</span></div>\s*<div class="reading-time-place"><span>KAIFENG</span><small>NORTHERN SONG MEMORY</small></div>\s*<div class="reading-time-copy"><small>RESEARCH QUEUE</small><h3>Dongjing Meng Hua Lu</h3>'
          timeline_repl = '''<article class="reading-time-item is-current" id="reading-003">
          <div class="reading-time-date"><strong>1147</strong><span>CE</span></div>
          <div class="reading-time-place"><span>KAIFENG</span><small>NORTHERN SONG MEMORY</small></div>
          <div class="reading-time-copy"><small>003 / ACTIVE DOSSIER</small><h3>Dongjing Meng Hua Lu</h3>'''
          text, count = re.subn(timeline, timeline_repl, text, count=1)
          if count != 1:
              raise SystemExit(f'Dongjing timeline replacements: {count}')

          text = text.replace('<small>003 QUEUED</small>', '<small>003 ACTIVE</small>', 1)
          index.write_text(text, encoding='utf-8')

          js = Path('reading/reading.js')
          js_text = js.read_text(encoding='utf-8')
          js_text = js_text.replace("meta: 'RESEARCH QUEUE / CITY + PEOPLE'", "meta: '003 / OPEN DOSSIER / CITY + PEOPLE'")
          js_text = js_text.replace("copy: 'A research path into night markets, services, consumption and the ordinary commercial density of a capital city.'", "copy: 'Ten volumes and eighty-six entries reconstruct Northern Song Kaifeng through walls, waterways, streets, markets, food, festivals and ordinary urban life.'")
          js.write_text(js_text, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reading/index.html reading/reading.js
          git commit -m "Open Dongjing Meng Hua Lu in Reading"
          git push origin HEAD:main
