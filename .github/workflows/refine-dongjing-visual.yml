name: Refine Dongjing visual
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refine-dongjing-visual.yml"
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Refine hero and scroll loading
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('reading/dongjing-meng-hua-lu/index.html')
          s = p.read_text(encoding='utf-8')
          old = '<figure class="dj-room-art" data-commons-figure><img data-commons-title="File:Alongtheriver_QingMing.jpg" data-commons-width="1800" alt="Along the River During the Qingming Festival, attributed to Zhang Zeduan, showing Northern Song urban life" fetchpriority="high" decoding="async"><figcaption><span>VISUAL WITNESS / 《清明上河圖》 / 12TH C.</span><a href="https://commons.wikimedia.org/wiki/File:Alongtheriver_QingMing.jpg">Wikimedia Commons / public-domain artwork reproduction ↗</a></figcaption></figure>'
          new = '<figure class="dj-room-art" data-commons-figure><img data-commons-title="File:Along the River During the Qingming Festival (detail of original).jpg" data-commons-width="1800" alt="Wooden bridge and urban traffic detail from Along the River During the Qingming Festival, attributed to Zhang Zeduan" fetchpriority="high" decoding="async"><figcaption><span>VISUAL WITNESS / 《清明上河圖》 / BRIDGE DETAIL</span><a href="https://commons.wikimedia.org/wiki/File:Along_the_River_During_the_Qingming_Festival_(detail_of_original).jpg">Wikimedia Commons / 3600 × 1800 public-domain detail ↗</a></figcaption></figure>'
          if old not in s:
              raise SystemExit('hero pattern not found')
          s = s.replace(old, new, 1)
          s = s.replace('data-commons-title="File:Alongtheriver_QingMing.jpg" data-commons-width="2200"', 'data-commons-title="File:Alongtheriver_QingMing.jpg" data-commons-width="6000"', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reading/dongjing-meng-hua-lu/index.html
          git commit -m "Refine Dongjing Qingming visual loading"
          git push origin HEAD:main
