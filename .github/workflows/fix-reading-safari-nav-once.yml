name: Fix Reading Safari navigation once

on:
  push:
    branches:
      - feat/fix-reading-safari-nav-20260830
    paths:
      - .github/workflows/fix-reading-safari-nav-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/fix-reading-safari-nav-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply Safari and Reading entrance repair
        run: node scripts/fix-reading-safari-nav.mjs
      - name: Install dependencies
        run: npm ci
      - name: Rebuild discovery assets
        run: npm run build:discovery
      - name: Run core release checks
        run: npm run release:core
      - name: Commit repaired site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Safari navigation and restore Reading 001 entrance"
          git push origin HEAD:feat/fix-reading-safari-nav-20260830
