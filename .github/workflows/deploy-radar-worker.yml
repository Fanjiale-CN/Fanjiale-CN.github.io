name: Deploy Galok Radar Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/radar/**"
      - ".github/workflows/deploy-radar-worker.yml"
  pull_request:
    branches: [main]
    paths:
      - "workers/radar/**"
      - ".github/workflows/deploy-radar-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: galok-radar-worker-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    name: Validate and deploy Radar Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers/radar

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate Worker source syntax
        run: node --check src/index.js

      - name: Build Worker bundle without publishing
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/galok-npm-cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/galok-wrangler-config
        run: npx --yes wrangler deploy --dry-run --outdir "$RUNNER_TEMP/radar-worker-dry-run"

      - name: Detect Cloudflare credentials
        if: github.event_name != 'pull_request'
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Radar Worker validated but deployment was skipped because Cloudflare credentials are not configured."
          fi

      - name: Deploy Radar Worker
        if: github.event_name != 'pull_request' && steps.credentials.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NPM_CONFIG_CACHE: ${{ runner.temp }}/galok-npm-cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/galok-wrangler-config
        run: npx --yes wrangler deploy

      - name: Verify production route
        if: github.event_name != 'pull_request' && steps.credentials.outputs.ready == 'true'
        working-directory: .
        shell: bash
        run: |
          body_file="$RUNNER_TEMP/radar-health-body"
          header_file="$RUNNER_TEMP/radar-health-headers"
          error_file="$RUNNER_TEMP/radar-health-error"

          for attempt in 1 2 3 4 5 6; do
            result="$(curl \
              --max-time 15 \
              --silent \
              --show-error \
              --location \
              --output "$body_file" \
              --dump-header "$header_file" \
              --write-out '%{http_code}|%{url_effective}' \
              https://www.galok.me/api/signals/ \
              2>"$error_file" || true)"

            code="${result%%|*}"
            effective_url="${result#*|}"
            echo "Radar health attempt $attempt: HTTP ${code:-000}; effective URL: ${effective_url:-unknown}"

            if [[ "$code" == "200" ]]; then
              echo "Radar Worker production route is live with candidate data."
              exit 0
            fi

            if [[ "$code" == "503" ]]; then
              echo "::notice::Radar Worker is reachable but currently serving the upstream fallback."
              echo "--- fallback diagnostics ---"
              head -c 2000 "$body_file" || true
              echo
              if [[ "$attempt" == "6" ]]; then
                echo "::warning::Radar deployment is healthy, but the discovery upstream remained unavailable during the health window."
                exit 0
              fi
            fi

            sleep 5
          done

          echo "Radar Worker production route did not return an expected status after deployment."
          echo "--- response headers ---"
          sed -n '1,40p' "$header_file" || true
          echo "--- response body ---"
          head -c 2000 "$body_file" || true
          echo
          echo "--- curl diagnostics ---"
          cat "$error_file" || true
          exit 1
