name: Temporary global nav alignment

on: [push]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append global navigation rule
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("styles.css")
          css = path.read_text(encoding="utf-8")
          marker = "GLOBAL NAV EDGE ALIGNMENT / 2026-09-06"
          block = """

/* GLOBAL NAV EDGE ALIGNMENT / 2026-09-06
   Keep the GALOK lockup on a consistent viewport-edge grid across the site.
   The immersive spatial homepage nav is intentionally excluded. */
html body .site-nav:not(.spatial-nav) > .nav-inner {
  width: calc(100% - 48px) !important;
  max-width: none !important;
  margin-inline: 24px !important;
}

@media (max-width: 720px) {
  html body .site-nav:not(.spatial-nav) > .nav-inner {
    width: calc(100% - 28px) !important;
    margin-inline: 14px !important;
  }
}
"""
          if marker not in css:
              path.write_text(css + block, encoding="utf-8")
          PY
      - name: Commit change
        run: |
          if [ "${GITHUB_ACTOR}" = "github-actions[bot]" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(nav): align GALOK brand across site"
          git push origin HEAD:${GITHUB_REF_NAME}
