name: Xi'an Cinematic Archive Preflight

on:
  push:
    branches:
      - work/xian-cinematic-archive-20260830

permissions:
  contents: write

concurrency:
  group: xian-cinematic-archive-preflight
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/xian-cinematic-archive-20260830
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Materialize cinematic archive
        shell: bash
        run: |
          set -euo pipefail
          base64 -d < .xian-preflight/xian-time.js.gz.b64 | gzip -d > be-a-viewer/xian/xian-time.js
          base64 -d < .xian-preflight/xian-time.css.gz.b64 | gzip -d > be-a-viewer/xian/xian-time.css
          base64 -d < .xian-preflight/validate-xian-history.mjs.gz.b64 | gzip -d > scripts/validate-xian-history.mjs
          sed -i 's/20260829-strata3/20260830-cinema1/g' \
            be-a-viewer/xian/index.html \
            be-a-viewer/xian/xian.js \
            be-a-viewer/xian/xian-history.js

      - name: Check module syntax
        run: |
          node --check be-a-viewer/xian/xian-time.js
          node --check be-a-viewer/xian/xian-history.js
          node --check be-a-viewer/xian/xian.js
          node --check scripts/validate-xian-history.mjs

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run complete release validation
        run: npm run release

      - name: Commit validated cinematic archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .xian-preflight
          rm -f .github/workflows/xian-cinematic-archive-preflight.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m "Rebuild Xi'an as cinematic photo archive"
          git push origin HEAD:work/xian-cinematic-archive-20260830
