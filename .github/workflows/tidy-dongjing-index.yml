name: Tidy Dongjing Reading index
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tidy-dongjing-index.yml"
permissions:
  contents: write
jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tidy initial state and timeline copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('reading/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<a class="reading-index-row is-active" href="/reading/dongjing-meng-hua-lu/" data-reading-preview="dongjing">', '<a class="reading-index-row" href="/reading/dongjing-meng-hua-lu/" data-reading-preview="dongjing">', 1)
          s = s.replace('<p>Night markets, consumption and what a city looks like when commerce becomes ordinary life.</p>', '<p>Walls, waterways, streets, markets, food, festivals and the routines of Northern Song urban life.</p>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit tidy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reading/index.html
          git commit -m "Tidy Dongjing Reading index state"
          git push origin HEAD:main
