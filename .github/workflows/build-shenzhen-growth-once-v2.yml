name: Build Shenzhen growth carousel once v2
on:
  push:
    branches: [feat/shenzhen-growth-carousel-20260830]
    paths: [.github/workflows/build-shenzhen-growth-once-v2.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Materialize carousel from reviewed WCP
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, textwrap
          src=Path('.github/workflows/build-shenzhen-growth-once.yml').read_text(encoding='utf-8')
          def block(target, tag):
              m=re.search(rf"cat > {re.escape(target)} <<'{tag}'\n(.*?)\n\s+{tag}\n",src,re.S)
              if not m: raise SystemExit(f'Cannot extract {target}')
              return textwrap.dedent(m.group(1))+'\n'
          html=block('/tmp/shenzhen-growth-section.html','HTML')
          css=block('be-a-viewer/shenzhen/shenzhen-growth.css','CSS')
          js=block('be-a-viewer/shenzhen/shenzhen-growth.js','JS')
          # Use the verified 2010 Commons filename from WCP 1.3.
          html=html.replace(
            'SZ_深圳福田區_Shenzhen_Futian_District_市民中心廣場_Civic_Centre_Shiminzhongxin_Aug-2010.jpg',
            'SZ_深圳福田區_Shenzhen_Futian_District_市民中心廣場_Civic_Centre_Shimin_Zhongxin_Square_Aug-2010_Book_City_EF.jpg'
          )
          Path('/tmp/shenzhen-growth-section.html').write_text(html,encoding='utf-8')
          Path('be-a-viewer/shenzhen/shenzhen-growth.css').write_text(css,encoding='utf-8')
          Path('be-a-viewer/shenzhen/shenzhen-growth.js').write_text(js,encoding='utf-8')

          p=Path('be-a-viewer/shenzhen/index.html')
          s=p.read_text(encoding='utf-8')
          css_tag='  <link rel="stylesheet" href="/be-a-viewer/shenzhen/shenzhen-growth.css?v=20260830-growth01">\n'
          if 'shenzhen-growth.css' not in s:
              marker='  <link rel="stylesheet" href="/be-a-viewer/shenzhen/shenzhen.css?v=city-frequency-20260826">\n'
              if marker not in s: raise SystemExit('Shenzhen stylesheet marker missing')
              s=s.replace(marker,marker+css_tag,1)
          if 'id="growth-archive"' not in s:
              marker='    <section class="sz-film-note"'
              i=s.find(marker)
              if i<0: raise SystemExit('film-note insertion marker missing')
              s=s[:i]+html+'\n'+s[i:]
          if 'shenzhen-growth.js' not in s:
              i=s.rfind('</body>')
              if i<0: raise SystemExit('body closing tag missing')
              s=s[:i]+'  <script src="/be-a-viewer/shenzhen/shenzhen-growth.js?v=20260830-growth01"></script>\n'+s[i:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify targeted carousel
        run: |
          node --check be-a-viewer/shenzhen/shenzhen-growth.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('be-a-viewer/shenzhen/index.html').read_text(encoding='utf-8')
          count=h.count('class="sz-growth-slide')
          assert count == 12, count
          years=re.findall(r'data-year="(\d{4})"',h)
          assert years==['1898','1978','1979','1982','1986','1988','1991','1996','2000','2010','2014','2026'],years
          c=Path('be-a-viewer/shenzhen/shenzhen-growth.css').read_text(encoding='utf-8')
          assert 'scroll-snap-type:x mandatory' in c
          assert 'data-sz-growth-track' in h
          assert 'shenzhen-growth.js?v=20260830-growth01' in h
          assert 'Shimin_Zhongxin_Square_Aug-2010_Book_City_EF.jpg' in h
          print('Shenzhen growth carousel targeted checks passed.')
          PY
      - name: Install CI tools
        run: npm ci --ignore-scripts
      - name: Generate discovery and run release core
        run: |
          npm run build:discovery
          npm run release:core
      - name: Commit tested carousel
        run: |
          rm -f .github/workflows/build-shenzhen-growth-once.yml .github/workflows/build-shenzhen-growth-once-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Shenzhen growth image carousel"
          git push origin HEAD:feat/shenzhen-growth-carousel-20260830
