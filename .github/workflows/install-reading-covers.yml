name: Install Reading covers

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-reading-covers.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install book covers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          salt = Path('reading/salt-and-iron/index.html')
          s = salt.read_text(encoding='utf-8')
          s = s.replace('https://media.galok.me/cities/xian/night-market--cd963a454540.jpeg', 'https://www.galok.me/assets/reading/yantielun-cover.webp')
          salt_cover = "\n".join([
              '      <figure class="reading-room-source reading-room-cover-frame">',
              '        <img src="/assets/reading/yantielun-cover.webp" alt="AI-generated Galok Reading cover artwork for Yantie Lun" fetchpriority="high" decoding="async" style="opacity:1;object-fit:contain;object-position:center;background:#e9e0d0;">',
              '        <figcaption><span><b>COVER ART / GALOK READING</b> 《鹽鐵論》</span><span>AI-generated cover artwork for this Reading project. Editorial interpretation; not a historical reproduction.</span></figcaption>',
              '      </figure>'
          ])
          s, n = re.subn(r'      <figure class="reading-room-source" data-commons-figure>.*?      </figure>', salt_cover, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Yantie Lun hero pattern not found')
          salt.write_text(s, encoding='utf-8')

          dongjing = Path('reading/dongjing-meng-hua-lu/index.html')
          s = dongjing.read_text(encoding='utf-8')
          s = s.replace('https://commons.wikimedia.org/wiki/Special:Redirect/file/Alongtheriver_QingMing.jpg', 'https://www.galok.me/assets/reading/dongjing-meng-hua-lu-cover.webp', 1)
          if '<meta name="twitter:image"' not in s:
              s = s.replace('<meta name="twitter:card" content="summary_large_image">', '<meta name="twitter:card" content="summary_large_image">\n  <meta name="twitter:image" content="https://www.galok.me/assets/reading/dongjing-meng-hua-lu-cover.webp">', 1)
          dongjing_cover = "\n".join([
              '      <figure class="dj-room-art dj-room-cover-frame">',
              '        <img src="/assets/reading/dongjing-meng-hua-lu-cover.webp" alt="AI-generated Galok Reading cover artwork for Dongjing Meng Hua Lu" fetchpriority="high" decoding="async" style="object-fit:contain;object-position:center;filter:none;background:#0d2a20;">',
              '        <figcaption><span>COVER ART / GALOK READING / AI-GENERATED</span><span>Editorial interpretation created for this Reading project; not a historical reproduction.</span></figcaption>',
              '      </figure>'
          ])
          s, n = re.subn(r'      <figure class="dj-room-art" data-commons-figure>.*?</figure>', dongjing_cover, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Dongjing hero pattern not found')
          dongjing.write_text(s, encoding='utf-8')
          PY

      - name: Commit cover integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reading/salt-and-iron/index.html reading/dongjing-meng-hua-lu/index.html
          git commit -m "Use AI-generated Reading covers"
          git push origin HEAD:main
