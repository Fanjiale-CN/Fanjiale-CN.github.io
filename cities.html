<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <title>Galok - Cities</title>
  <link rel="stylesheet" href="styles.css?v=monet-xiamen">
</head>
<body>
  <div id="scroll-progress" aria-hidden="true"></div>

  <nav class="site-nav" aria-label="Primary navigation">
    <a class="brand" href="index.html">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>Galok</span>
    </a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="gallery-xiamen-v2.html">Xiamen</a>
      <a href="cities.html" aria-current="page">Cities</a>
      <a href="about.html">About</a>
    </div>
  </nav>

  <header class="subpage-hero">
    <div class="subpage-media">
      <img src="images/xiamen/twin-towers.webp" width="1656" height="2200" alt="厦门双子塔仰拍" fetchpriority="high">
    </div>
    <div class="subpage-content" data-reveal>
      <p class="kicker">City Memory</p>
      <h1 class="page-title">Cities</h1>
      <p class="page-copy">每座城市都有自己的光线速度。厦门这一章先完成，后续城市会沿用同一套更安静、更影像化的结构。</p>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="cities-list">
        <figure class="city-tile" data-reveal>
          <a href="gallery-xiamen-v2.html">
            <img src="images/xiamen/ferry.webp" width="1650" height="2200" alt="厦门渡口海面与白色大桥" loading="lazy">
            <h2>Xiamen</h2>
            <p>Sea, garden, campus, old streets and Gulangyu.</p>
          </a>
        </figure>

        <figure class="city-tile is-muted" data-reveal>
          <div class="city-shell">
            <img src="images/xiamen/city-road.webp" width="1656" height="2200" alt="厦门高架道路与白云" loading="lazy">
            <h2>Xi'an</h2>
            <p>Coming later.</p>
          </div>
        </figure>

        <figure class="city-tile is-muted" data-reveal>
          <div class="city-shell">
            <img src="images/xiamen/return-01.webp" width="1656" height="2200" alt="傍晚海面与远处城市天际线" loading="lazy">
            <h2>Hong Kong</h2>
            <p>Coming later.</p>
          </div>
        </figure>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <span>Galok Cities</span>
    <a class="text-link" href="index.html">Home</a>
  </footer>

  <script src="script.js?v=monet-xiamen"></script>
